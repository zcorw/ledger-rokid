<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>知产确认演示</title><style>body{background:#000;color:#40ff5e;font:22px sans-serif;max-width:600px;margin:auto;padding:16px}button,input{font:inherit;box-sizing:border-box;max-width:100%;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>虚构数据演示 · 不提交</h1><main id="app"></main><script type="module">
import {createReview,fields,syntheticReceipt} from '../aiui/lib/review.js';
const r=createReview();const app=document.querySelector('#app');
function button(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=()=>{fn();render()};app.append(b);}
function render(){app.replaceChildren();const s=r.snapshot();if(s.state==='editing'){const [key,label,max]=fields[s.index];const l=document.createElement('label');l.textContent=`${s.index+1}/${fields.length} ${label}`;const i=document.createElement('input');i.value=s.values[key];i.maxLength=max;i.oninput=()=>{r.edit(i.value)};l.append(i);app.append(l);button('上一字段',()=>r.move(-1));button('下一字段',()=>r.move(1));const e=document.createElement('p');e.textContent=s.errors.join('；');app.append(e);button('预览全部字段',()=>r.preview());}if(s.state==='review'){const pre=document.createElement('pre');pre.textContent=fields.map(([k,l])=>`${l}: ${s.values[k]||'未填写'}`).join('\n');app.append(pre);button('返回修改',()=>r.back());button('确认本地内容（不提交）',()=>r.confirm());}if(s.state==='confirmed'){const p=document.createElement('p');p.textContent='已确认本地内容。尚未提交，也未接入账务服务。';app.append(p);}button('取消并清除',()=>r.cancel());button('重新加载虚构数据',()=>r.load(syntheticReceipt));}
document.addEventListener('visibilitychange',()=>{if(document.hidden){r.cancel();render()}});r.load(syntheticReceipt);render();
</script></html>
