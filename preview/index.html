<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账单</title>
<style>
* { box-sizing:border-box; }
body { margin:0 auto; max-width:480px; background:#000; color:#40ff5e; font:18px sans-serif; }
#app { padding:16px; }
.bill { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
.total { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px; }
.currency { font-size:28px; font-weight:600; }
.amount { font-weight:700; line-height:1.08; max-width:100%; overflow-wrap:anywhere; }
.merchant { margin:0; font-size:22px; font-weight:600; overflow-wrap:anywhere; }
.details { display:flex; justify-content:space-between; gap:12px; }
.note { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
.editor { border-top:1px solid #155c24; padding-top:10px; }
.field { display:flex; align-items:center; gap:12px; margin-bottom:8px; font-size:16px; }
input { flex:1; min-width:0; width:100%; font:18px sans-serif; color:inherit; background:#000; border:1px solid #155c24; padding:6px; }
.errors { font-size:16px; margin:0 0 8px; }
.errors:empty { display:none; }
.actions { display:flex; gap:6px; }
button { flex:1; min-width:0; padding:6px; border:1px solid #155c24; background:#000; color:inherit; font:16px sans-serif; }
button:focus-visible, input:focus-visible { outline:2px solid #40ff5e; outline-offset:2px; }
</style>
<main id="app"></main>
<script type="module" src="review.js"></script>
</html>
